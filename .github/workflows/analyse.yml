name: Analyse career opportunities

on:
  push:
    paths:
      - "data/**"
      - "config/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/analyse.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Generate analysis outputs
        run: python src/analyze_jobs.py

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: career-analysis-outputs
          path: outputs/
